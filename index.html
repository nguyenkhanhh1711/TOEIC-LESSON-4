const P=[["Part 1: Chuẩn bị kế hoạch", "Preparing a Plan", "Before we start a new business, we must gather information. Then, we can develop a good strategy. This plan will address the needs of our customers and help us succeed in the market.", "Trước khi bắt đầu một doanh nghiệp mới, chúng ta phải thu thập thông tin. Sau đó, chúng ta có thể phát triển một chiến lược tốt. Kế hoạch này sẽ giải quyết (hướng tới) nhu cầu của khách hàng và giúp chúng ta thành công trên thị trường.", 0, 4], ["Part 2: Phân tích thị trường", "Analyzing the Market", "We need to evaluate the market carefully. There is always a risk when you open a new shop. Therefore, we should primarily focus on building a strong financial base to survive hard times.", "Chúng ta cần đánh giá thị trường một cách cẩn thận. Luôn có rủi ro khi bạn mở một cửa hàng mới. Vì vậy, chúng ta chủ yếu nên tập trung vào việc xây dựng một nền tảng tài chính vững mạnh để sống sót qua những thời kỳ khó khăn.", 4, 8], ["Part 3: Vượt qua vấn đề", "Overcoming Problems", "To avoid failure, we must demonstrate our value to the buyers. We will offer them great products at good prices. If a product is out of stock, we need to have a good substitution ready for them.", "Để tránh thất bại, chúng ta phải chứng minh giá trị của mình với người mua. Chúng ta sẽ cung cấp (đưa ra) cho họ những sản phẩm tuyệt vời với giá tốt. Nếu một sản phẩm hết hàng, chúng ta cần chuẩn bị sẵn một sự thay thế tốt cho họ.", 8, 12]];
const hl=s=>s.replace(/\b(gather|develop|strategy|address|evaluate|risk|primarily|strong|avoid|demonstrate|offer|substitution)\b/gi,"<mark>$1</mark>");
const Q=[["m:address", ["Giải quyết, trình bày", "Tránh xa", "Thu thập", "Cung cấp"], 0, "<b>address</b> (v, n) = Giải quyết, hướng tới, trình bày. Họ từ: —."], ["m:avoid", ["Đánh giá", "Tránh, tránh xa", "Rủi ro", "Mạnh mẽ"], 1, "<b>avoid</b> (v) = Tránh, tránh xa. Họ từ: avoidance (n), avoided (adj)."], ["m:demonstrate", ["Phát triển", "Cung cấp", "Chứng minh", "Thay thế"], 2, "<b>demonstrate</b> (v) = Chứng minh, biểu diễn. Họ từ: demonstration (n), demonstrative (adj)."], ["m:develop", ["Thay thế", "Thu thập", "Rủi ro", "Phát triển"], 3, "<b>develop</b> (v) = Phát triển, mở rộng. Họ từ: development (n), developer (n)."], ["m:evaluate", ["Đánh giá", "Tránh né", "Giải quyết", "Trình bày"], 0, "<b>evaluate</b> (v) = Đánh giá, định giá. Họ từ: evaluation (n), evaluator (n)."], ["m:gather", ["Chủ yếu", "Chiến lược", "Thu thập", "Chứng minh"], 2, "<b>gather</b> (v) = Thu thập, tập hợp lại. Họ từ: gathering (n)."], ["m:offer", ["Sự thay thế", "Đề nghị, cung cấp", "Rủi ro", "Mạnh mẽ"], 1, "<b>offer</b> (n, v) = Đề nghị, cung cấp, đưa ra. Họ từ: offering (n)."], ["m:primarily", ["Sự thay thế", "Thu thập", "Chủ yếu, trước hết", "Tránh né"], 2, "<b>primarily</b> (adv) = Chủ yếu, trước hết. Họ từ: primary (adj)."], ["m:risk", ["Rủi ro", "Sự cung cấp", "Sự phát triển", "Sự thay thế"], 0, "<b>risk</b> (n, v) = Rủi ro, nguy cơ. Họ từ: risky (adj)."], ["m:strategy", ["Mạnh mẽ", "Chiến lược", "Đánh giá", "Trình bày"], 1, "<b>strategy</b> (n) = Chiến lược, kế hoạch hành động. Họ từ: strategize (v), strategic (adj)."], ["m:strong", ["Yếu đuối", "Mạnh mẽ", "Rủi ro", "Chủ yếu"], 1, "<b>strong</b> (adj) = Mạnh mẽ, vững vàng. Họ từ: strength (n), strongly (adv)."], ["m:substitution", ["Sự thay thế", "Chiến lược", "Sự chứng minh", "Việc thu thập"], 0, "<b>substitution</b> (n) = Sự thay thế, vật thay thế. Họ từ: substitute (v, n), substituted (adj)."], ["The manager will ______ the problem today.", ["address", "substitution", "primarily", "strong"], 0, "Đáp án <b>address</b>: Giám đốc sẽ giải quyết vấn đề hôm nay."], ["You should ______ eating too much fast food.", ["offer", "avoid", "gather", "develop"], 1, "Đáp án <b>avoid</b>: Bạn nên tránh ăn quá nhiều đồ ăn nhanh."], ["Let me ______ how this machine works.", ["strategy", "strong", "demonstrate", "risk"], 2, "Đáp án <b>demonstrate</b>: Để tôi trình diễn cách máy này hoạt động."], ["We need to ______ a new software program.", ["develop", "risk", "substitution", "primarily"], 0, "Đáp án <b>develop</b>: Chúng tôi cần phát triển một phần mềm mới."], ["Please ______ the quality of these products.", ["evaluate", "avoid", "strong", "gather"], 0, "Đáp án <b>evaluate</b>: Hãy đánh giá chất lượng các sản phẩm này."], ["They will ______ in the meeting room at 2 PM.", ["strategy", "substitution", "gather", "risk"], 2, "Đáp án <b>gather</b>: Họ sẽ tập trung (tụ họp) ở phòng họp lúc 2 giờ chiều."], ["Can I ______ you a cup of coffee?", ["demonstrate", "offer", "evaluate", "avoid"], 1, "Đáp án <b>offer</b>: Tôi mời bạn một tách cà phê nhé?"], ["The book is ______ for young children.", ["primarily", "gather", "strong", "address"], 0, "Đáp án <b>primarily</b>: Cuốn sách chủ yếu dành cho trẻ nhỏ."], ["Starting a business always involves some ______.", ["offer", "risk", "avoid", "evaluate"], 1, "Đáp án <b>risk</b>: Khởi nghiệp luôn đi kèm một chút rủi ro."], ["What is your ______ to win the game?", ["strategy", "strong", "gather", "primarily"], 0, "Đáp án <b>strategy</b>: Chiến lược của bạn để thắng trò chơi là gì?"], ["He is a very ______ man; he can lift 100 kg.<br><small style=\"opacity:.65\">※ Đề gốc thiếu phương án A–D, phương án do mình thêm theo đáp án C.</small>", ["gather", "primarily", "strong", "strategy"], 2, "Đáp án <b>strong</b>: Anh ấy rất mạnh mẽ; anh có thể nhấc 100 kg."], ["Honey is a good ______ for sugar.<br><small style=\"opacity:.65\">※ Đề gốc thiếu phương án A–D, phương án do mình thêm theo đáp án C.</small>", ["address", "demonstrate", "substitution", "gather"], 2, "Đáp án <b>substitution</b>: Mật ong là chất thay thế tốt cho đường."], ["The teacher will ______ the students' essays.", ["gather", "evaluate", "strong", "substitution"], 1, "Đáp án <b>evaluate</b>: Giáo viên sẽ đánh giá bài luận của học sinh."], ["We need to ______ more evidence for the case.", ["strategy", "primarily", "address", "gather"], 3, "Đáp án <b>gather</b>: Chúng ta cần thu thập thêm bằng chứng cho vụ án."], ["They gave me a job ______ yesterday.", ["offer", "avoid", "risk", "strong"], 0, "Đáp án <b>offer</b>: Hôm qua họ đưa cho tôi một lời mời làm việc (job offer)."], ["The company earns money ______ from software sales.", ["evaluate", "primarily", "develop", "substitution"], 1, "Đáp án <b>primarily</b>: Công ty kiếm tiền chủ yếu từ bán phần mềm."], ["Investing in that company is a huge ______.", ["gather", "risk", "address", "offer"], 1, "Đáp án <b>risk</b>: Đầu tư vào công ty đó là một rủi ro lớn."], ["Our marketing ______ was very successful.", ["substitution", "strong", "strategy", "avoid"], 2, "Đáp án <b>strategy</b>: Chiến lược marketing của chúng tôi rất thành công."], ["You need a ______ password for your email.", ["demonstrate", "primarily", "evaluate", "strong"], 3, "Đáp án <b>strong</b>: Bạn cần một mật khẩu mạnh cho email."], ["There is no ______ for hard work.", ["substitution", "risk", "develop", "gather"], 0, "Đáp án <b>substitution</b>: Không có gì thay thế được sự chăm chỉ."], ["The mayor gave a public ______ on TV.", ["strategy", "address", "strong", "primarily"], 1, "Đáp án <b>address</b>: Thị trưởng có một bài phát biểu (address) công khai trên TV."], ["She took another road to ______ the heavy traffic.", ["substitution", "avoid", "evaluate", "offer"], 1, "Đáp án <b>avoid</b>: Cô ấy đi đường khác để tránh kẹt xe."], ["His actions ______ his loyalty to the team.", ["demonstrate", "gather", "risk", "strategy"], 0, "Đáp án <b>demonstrate</b>: Hành động của anh chứng tỏ lòng trung thành với đội."], ["Reading books helps ______ your brain.", ["develop", "primarily", "address", "strong"], 0, "Đáp án <b>develop</b>: Đọc sách giúp phát triển trí não."], ["It is hard to ______ the total cost right now.", ["substitution", "evaluate", "avoid", "offer"], 1, "Đáp án <b>evaluate</b>: Khó mà đánh giá tổng chi phí lúc này."], ["The squirrel ______ nuts for the winter.", ["strategy", "risk", "gathers", "demonstrates"], 2, "Đáp án <b>gathers</b>: Con sóc thu thập hạt cho mùa đông (chủ ngữ số ít nên dùng gathers)."], ["We have a special ______ for new customers.", ["strong", "evaluate", "primarily", "offer"], 3, "Đáp án <b>offer</b>: Chúng tôi có ưu đãi (offer) đặc biệt cho khách hàng mới."], ["I am ______ interested in the salary.", ["address", "primarily", "substitution", "gather"], 1, "Đáp án <b>primarily</b>: Tôi chủ yếu quan tâm đến mức lương."], ["If you do not wear a seatbelt, you ______ injury.", ["develop", "risk", "strategy", "demonstrate"], 1, "Đáp án <b>risk</b>: Nếu không thắt dây an toàn, bạn có nguy cơ bị thương (risk là động từ)."], ["The chess player thought of a brilliant ______.", ["strong", "avoid", "strategy", "evaluate"], 2, "Đáp án <b>strategy</b>: Kỳ thủ nghĩ ra một chiến lược tuyệt vời."], ["We felt a ______ wind blowing from the sea.", ["substitution", "strong", "gather", "offer"], 1, "Đáp án <b>strong</b>: Chúng tôi cảm nhận cơn gió mạnh thổi từ biển."], ["Tofu is a popular meat ______ for vegans.", ["substitution", "risk", "address", "primarily"], 0, "Đáp án <b>substitution</b>: Đậu phụ là món thay thế thịt phổ biến cho người ăn chay."], ["Please ______ your letter to the director.", ["develop", "evaluate", "address", "avoid"], 2, "Đáp án <b>address</b>: Hãy đề địa chỉ (address) thư của bạn gửi giám đốc."], ["She tried to ______ looking at him.", ["avoid", "demonstrate", "strategy", "strong"], 0, "Đáp án <b>avoid</b>: Cô ấy cố tránh nhìn anh ta."], ["The chart ______ a decrease in sales.", ["substitution", "primarily", "risk", "demonstrates"], 3, "Đáp án <b>demonstrates</b>: Biểu đồ cho thấy doanh số giảm."], ["They want to ______ a new marketing plan.", ["offer", "gather", "develop", "strong"], 2, "Đáp án <b>develop</b>: Họ muốn phát triển một kế hoạch marketing mới."]];

let AC;function tone(f,t,d,type,v=.18){AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime+t);g.gain.setValueAtTime(v,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}
const good=()=>{try{tone(660,0,.15,"sine");tone(880,.12,.15,"sine");tone(1175,.24,.3,"sine")}catch(e){}};
const bad=()=>{try{tone(200,0,.2,"sawtooth",.12);tone(130,.18,.35,"sawtooth",.12)}catch(e){}};

P.forEach(p=>S.push(`<div class="slide"><div class="in"><h2>✦ ${p[0]}</h2><div style="opacity:.75;margin:-4px 0 10px;font-style:italic">${p[1]}</div><div class="card"><div class="en">${hl(p[2])}</div><button class="btn" style="margin:10px 8px 0 0;padding:7px 18px" onclick="say(this.closest('.card').querySelector('.en').innerText,.85)">🔊 Nghe đoạn văn</button><button class="btn" style="margin-top:10px;padding:7px 18px" onclick="const v=this.nextElementSibling,o=v.style.display=='block';v.style.display=o?'none':'block';this.textContent=o?'Hiện bản dịch 👁':'Ẩn bản dịch 🙈'">Hiện bản dịch 👁</button><div class="vi" style="display:none">${p[3]}</div></div><div class="grid">${W.slice(p[4],p[5]).map((w,i)=>`<div class="w" style="animation-delay:${i*.12}s"><b>${w[0]}</b><button class="spk" onclick="say('${w[0]}')" title="Nghe phát âm">🔊</button><span class="pos">${w[1]}</span><div class="ipa">${w[2]}</div><div>${w[3]}</div><div class="fam">💠 ${w[4]}</div></div>`).join("")}</div></div></div>`));
S.push(`<div class="slide"><div class="in"><h2>💠 Bài tập trắc nghiệm</h2><div class="bar"><i id="pb"></i></div><div class="card" id="qa"></div></div></div>`);
S.push(`<div class="slide"><div class="in"><h2>✍️ Dịch câu (Writing)</h2><div class="card">Dịch sang tiếng Anh bằng từ gợi ý, rồi bấm xem đáp án gợi ý.</div>${T.map((t,i)=>`<div class="card"><b>${i+1}. ${t[0]}</b> <span class="hint">${t[1]}</span><textarea rows="2" placeholder="Viết câu của bạn..."></textarea><button class="btn" style="margin-top:8px;padding:7px 18px" onclick="this.nextElementSibling.style.display='block';this.style.display='none'">Xem đáp án</button><div class="ans">✅ ${t[2]}</div></div>`).join("")}</div></div>`);
document.getElementById("tr").innerHTML=S.join("");

let cur=0;function go(d){cur=Math.max(0,Math.min(S.length-1,cur+d));tr.style.transform=`translateX(-${cur*100}%)`;document.querySelectorAll(".dots i").forEach((e,i)=>e.classList.toggle("on",i==cur));document.querySelectorAll(".slide")[cur].querySelectorAll(".in,.w").forEach(e=>{e.style.animation="none";e.offsetHeight;e.style.animation=""})}

// Quiz logic
let qi=0,sc=0;
function rq(){const q=Q[qi],qa=document.getElementById("qa");pb.style.width=(qi/Q.length*100)+"%";
const txt=q[0].startsWith("m:")?`Từ "<span style="color:var(--acc)">${q[0].slice(2)}</span>" có nghĩa là gì?`:q[0];
qa.innerHTML=`<small>Câu ${qi+1}/${Q.length} · Điểm: ${sc}</small><div class="q">${txt}</div>${q[1].map((o,i)=>`<button class="opt" onclick="pick(${i})">${"ABCD"[i]}. ${o}</button>`).join("")}<div class="fb" id="fb"></div>`}
function pick(i){const q=Q[qi],b=document.querySelectorAll(".opt");b.forEach((x,j)=>{x.disabled=true;if(j==q[2])x.classList.add("ok")});

function nq(){qi++;if(qi<Q.length)rq();else{pb.style.width="100%";const m=sc>=Q.length*.9?"Xuất sắc! 🌟":sc>=Q.length*.7?"Rất tốt! 💠":sc>=Q.length*.5?"Khá ổn, ôn thêm nhé ✦":"Cố lên, xem lại bài học nhé 🐱";qa.innerHTML=`<div class="big">${sc} / ${Q.length}</div><p style="text-align:center;font-size:1.2rem">${m}</p><div style="text-align:center"><button class="btn" onclick="qi=0;sc=0;rq()">Làm lại</button> <button class="btn" onclick="go(1)">Sang phần dịch ›</button></div>`}}
rq();

if(m=="habit")[8,22,36,50,64,78,92].forEach((p,i)=>d.innerHTML+=`<i class="dt" style="left:${p}%;animation-delay:${i*.12}s"></i>`);
if(m=="fact")d.innerHTML='<i class="full"></i>';
if(m=="future")d.innerHTML='<i class="arr"></i><i class="st" style="left:80%">★</i>'}
function say(x,r=.85){if(!window.speechSynthesis){alert("Trình duyệt chưa hỗ trợ đọc giọng nói");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x),vs=speechSynthesis.getVoices();u.lang="en-US";u.rate=r;const v=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
